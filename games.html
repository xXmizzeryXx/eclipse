// ── SERVICE WORKER ────────────────────────────────────────────────
let swReg = null;
let swReady = false;

async function initSW() {
  if (!('serviceWorker' in navigator)) {
    console.warn('ZenoPack SW: not supported');
    return false;
  }
  try {
    swReg = await navigator.serviceWorker.register('/zenopack-sw.js', { scope: '/' });
    await navigator.serviceWorker.ready;
    swReady = true;
    return true;
  } catch(e) {
    console.error('ZenoPack SW registration failed:', e);
    return false;
  }
}

function getSW() {
  return navigator.serviceWorker?.controller || swReg?.active || null;
}

function postSW(msg, transfers = []) {
  return new Promise((resolve, reject) => {
    const sw = getSW();
    if (!sw) return reject(new Error('No SW'));
    const mc = new MessageChannel();
    mc.port1.onmessage = e => resolve(e.data);
    sw.postMessage(msg, [mc.port2, ...transfers]);
    setTimeout(() => reject(new Error('SW timeout')), 8000);
  });
}

async function pingGame(gameId) {
  try {
    const res = await postSW({ type: 'PING_GAME', gameId });
    return res.type === 'GAME_FOUND';
  } catch(e) { return false; }
}

async function registerGameWithSW(gameId, fileRecords) {
  if (!swReady) await initSW();
  const sw = getSW();
  if (!sw) return false;
  try {
    const filesMeta = fileRecords.map(r => ({ path: r.path, mimeType: r.mimeType }));
    const buffers = await Promise.all(fileRecords.map(r => r.file.arrayBuffer()));
    const clones = buffers.map(b => b.slice(0));
    const res = await postSW({ type: 'REGISTER_GAME', gameId, filesMeta, buffers: clones }, clones);
    return res.type === 'GAME_REGISTERED';
  } catch(e) {
    console.error('SW register failed:', e);
    return false;
  }
}

// Imported zenopack games — stored in IndexedDB (no size limit)
let importedGames = [];

const ZP_DB_NAME = 'eclipse-zenopack';
const ZP_DB_VERSION = 1;
let zpDb = null;

function openZpDB() {
  return new Promise((resolve, reject) => {
    if (zpDb) return resolve(zpDb);
    const req = indexedDB.open(ZP_DB_NAME, ZP_DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('games')) db.createObjectStore('games', { keyPath: 'gameId' });
      if (!db.objectStoreNames.contains('files')) {
        const fs = db.createObjectStore('files', { keyPath: 'id' });
        fs.createIndex('gameId', 'gameId');
      }
    };
    req.onsuccess = e => { zpDb = e.target.result; resolve(zpDb); };
    req.onerror = () => reject(req.error);
  });
}

async function saveGameToDB(entry) {
  const db = await openZpDB();
  // Read all file buffers BEFORE opening transaction
  const filesToStore = entry.fileRecords.map((f, i) => ({
    id: entry.gameId + '_' + i,
    gameId: entry.gameId,
    path: f.path,
    mimeType: f.mimeType,
    data: f.data,
  }));
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['games','files'], 'readwrite');
    tx.objectStore('games').put({ gameId: entry.gameId, name: entry.name, category: entry.category, entryUrl: entry.entryUrl });
    filesToStore.forEach(f => tx.objectStore('files').put(f));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function loadGamesFromDB() {
  const db = await openZpDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('games', 'readonly');
    const req = tx.objectStore('games').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function loadFilesFromDB(gameId) {
  const db = await openZpDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readonly');
    const idx = tx.objectStore('files').index('gameId');
    const req = idx.getAll(gameId);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function deleteGameFromDB(gameId) {
  const db = await openZpDB();
  const files = await loadFilesFromDB(gameId);
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['games','files'], 'readwrite');
    tx.objectStore('games').delete(gameId);
    files.forEach(f => tx.objectStore('files').delete(f.id));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

  const grid = document.getElementById('gamesGrid');
  const noResults = document.getElementById('noResults');
  const loading = document.getElementById('loading');

  const allGames = [
    ...builtInGames,
    ...importedGames.map(g => ({ ...g, imported: true }))
  ];

  const filtered = allGames.filter(game => {
    const matchesCategory = currentCategory === 'all' || game.category === currentCategory;
    const matchesSearch = searchQuery === '' || game.name.toLowerCase().includes(searchQuery.toLowerCase());
    return matchesCategory && matchesSearch;
  });

  loading.style.display = 'none';

  if (filtered.length === 0) {
    grid.style.display = 'none';
    noResults.style.display = 'block';
  } else {
    grid.style.display = 'grid';
    noResults.style.display = 'none';
    grid.innerHTML = filtered.map(game => {
      const href = game.imported
        ? '#'
        : `game-modal.html?game=${encodeURIComponent(game.folder)}`;
      const onClickAttr = game.imported
        ? `onclick="event.preventDefault();openZpPlayer('${game.entryUrl.replace(/'/g,"\'")}','${game.name.replace(/'/g,"\'")}')"`
        : '';
      const exportBtn = !game.imported
        ? `<button class="zp-export-btn" onclick="event.preventDefault();event.stopPropagation();exportGame('${game.folder}','${game.name.replace(/'/g,"\\'")}','${game.category}')" title="Export as .zenopack"><i class="fa-solid fa-box-archive"></i> .zenopack</button>`
        : `<button class="zp-export-btn" onclick="event.preventDefault();event.stopPropagation();removeImported('${game.name.replace(/'/g,"\\'")}')"><i class="fa-solid fa-xmark"></i> remove</button>`;
      return `
        <a href="${href}" class="game-card" ${onClickAttr}>
          ${exportBtn}
          <div class="game-info">
            <h3 class="game-title">${game.name}</h3>
            <div class="game-category">${game.imported ? '&#128230; ' : ''}${game.category}</div>
          </div>
        </a>`;
    }).join('');
  }

  document.getElementById('gameCount').textContent = filtered.length;
}

// ── EXPORT ────────────────────────────────────────────────────────
async function exportGame(folder, name, category) {
  showZpToast('Packaging game...', '');
  try {
    const baseUrl = GAME_BASE_URL + '/' + folder + '/';
    const indexRes = await fetch(baseUrl + 'index.html');
    if (!indexRes.ok) throw new Error('Could not read game files — make sure the game folder exists in /games/');
    const indexHtml = await indexRes.text();

    const assetPaths = extractAssetPaths(indexHtml);
    const allPaths = ['index.html', ...assetPaths];
    const files = [];

    for (const path of allPaths) {
      try {
        const res = await fetch(baseUrl + path);
        if (!res.ok) continue;
        const buf = await res.arrayBuffer();
        files.push({ path, mimeType: getMime(path.split('/').pop()), data: Array.from(new Uint8Array(buf)) });
      } catch(e) { /* skip */ }
    }

    if (!files.length) throw new Error('No files downloaded');

    const pack = { zenopack: ZENOPACK_VERSION, name, category, fileCount: files.length, exportedAt: new Date().toISOString(), files };
    const blob = new Blob([JSON.stringify(pack)], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = folder + '.zenopack';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showZpToast(name + ' exported!', 'ok');
  } catch(e) {
    showZpToast('Export failed: ' + e.message, 'err');
  }
}

function extractAssetPaths(html) {
  const assets = new Set();
  const patterns = [/src=["']([^"']+)["']/gi, /href=["']([^"']+)["']/gi];
  for (const re of patterns) {
    let m;
    while ((m = re.exec(html)) !== null) {
      const raw = m[1].trim();
      if (!raw || raw.startsWith('http') || raw.startsWith('//') || raw.startsWith('data:') || raw.startsWith('#') || raw.startsWith('mailto:')) continue;
      assets.add(raw.replace(/^\.\//, ''));
    }
  }
  return [...assets];
}

// ── IMPORT ────────────────────────────────────────────────────────
function openZpModal() {
  document.getElementById('zpModal').classList.add('open');
  setZpStatus('', '');
  document.getElementById('zpProgressBar').style.width = '0%';
  document.getElementById('zpFileInput').value = '';
}
function closeZpModal() {
  document.getElementById('zpModal').classList.remove('open');
  document.getElementById('zpFileInput').value = '';
}
function setZpStatus(msg, cls) {
  const el = document.getElementById('zpStatus');
  el.textContent = msg;
  el.className = 'zp-status' + (cls ? ' ' + cls : '');
}

async function handleZpImport(file) {
  if (!file || !file.name.endsWith('.zenopack')) { setZpStatus('Must be a .zenopack file', 'err'); return; }
  setZpStatus('Reading file...', 'info');
  document.getElementById('zpProgressBar').style.width = '25%';

  try {
    const text = await file.text();
    const pack = JSON.parse(text);
    if (!pack.zenopack || !Array.isArray(pack.files) || !pack.files.length) throw new Error('Invalid .zenopack file');
    const indexFile = pack.files.find(f => f.path.toLowerCase() === 'index.html');
    if (!indexFile) throw new Error('Missing index.html in pack');

    document.getElementById('zpProgressBar').style.width = '65%';
    setZpStatus('Loading game...', 'info');

    // Build fileRecords for SW registration
    const fileRecords = pack.files.map(f => {
      const fileObj = new File([new Uint8Array(f.data)], f.path.split('/').pop(), { type: f.mimeType });
      return { file: fileObj, path: f.path, mimeType: f.mimeType };
    });

    document.getElementById('zpProgressBar').style.width = '50%';
    setZpStatus('Registering with service worker...', 'info');

    // Generate a unique game ID
    const gameId = 'zp' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

    if (!swReady) await initSW();
    const ok = await registerGameWithSW(gameId, fileRecords);
    if (!ok) throw new Error('Service worker registration failed — try refreshing the page');

    const entryUrl = `/zenopack-games/${gameId}/index.html`;

    // Save to IndexedDB
    const entry = {
      name: pack.name,
      category: pack.category || 'arcade',
      gameId,
      entryUrl,
      fileRecords: pack.files.map(f => ({ path: f.path, mimeType: f.mimeType, data: f.data }))
    };
    await saveGameToDB(entry);
    importedGames.push({ name: entry.name, category: entry.category, gameId, entryUrl });

    document.getElementById('zpProgressBar').style.width = '100%';
    setZpStatus('Game imported!', 'ok');
    renderGames();
    setTimeout(() => { closeZpModal(); showZpToast(pack.name + ' added!', 'ok'); }, 700);
  } catch(e) {
    setZpStatus('Failed: ' + e.message, 'err');
    document.getElementById('zpProgressBar').style.width = '0%';
  }
  document.getElementById('zpFileInput').value = '';
}

async function removeImported(name) {
  if (!confirm('Remove "' + name + '" from your library?')) return;
  const game = importedGames.find(g => g.name === name);
  if (game?.gameId) await deleteGameFromDB(game.gameId).catch(console.error);
  importedGames = importedGames.filter(g => g.name !== name);
  renderGames();
  showZpToast(name + ' removed', '');
}

document.getElementById('zpFileInput').addEventListener('change', e => handleZpImport(e.target.files[0]));

const zpDrop = document.getElementById('zpDrop');
zpDrop.addEventListener('dragover', e => { e.preventDefault(); zpDrop.classList.add('over'); });
zpDrop.addEventListener('dragleave', () => zpDrop.classList.remove('over'));
zpDrop.addEventListener('drop', e => {
  e.preventDefault(); zpDrop.classList.remove('over');
  handleZpImport(e.dataTransfer.files[0]);
});
document.getElementById('zpModal').addEventListener('click', e => {
  if (e.target === document.getElementById('zpModal')) closeZpModal();
});

// ── TOAST ─────────────────────────────────────────────────────────
let zpToastTimer;
function showZpToast(msg, type) {
  const t = document.getElementById('zpToast');
  t.textContent = msg; t.className = 'zp-toast' + (type ? ' ' + type : '');
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(zpToastTimer);
  zpToastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── FILTERS & SEARCH ──────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentCategory = this.getAttribute('data-category');
    renderGames();
  });
});

document.getElementById('gameSearch').addEventListener('input', function(e) {
  searchQuery = e.target.value;
  renderGames();
});

// ── CLOAK ─────────────────────────────────────────────────────────
const cloakPresets = [
  { title: "Google", favicon: "https://www.google.com/favicon.ico" },
  { title: "Google Docs", favicon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico" },
  { title: "Google Classroom", favicon: "https://ssl.gstatic.com/classroom/favicon.png" },
  { title: "Canvas", favicon: "https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico" }
];
document.getElementById('emergencyCloakBtn').addEventListener('click', () => {
  const p = cloakPresets[Math.floor(Math.random() * cloakPresets.length)];
  document.title = p.title;
  document.querySelector('link[rel="icon"]').href = p.favicon;
});

renderGames();

// Load games from IDB and re-register with SW on page load
(async function reRegisterGames() {
  try {
    const saved = await loadGamesFromDB();
    if (!saved.length) return;
    await initSW();
    for (const g of saved) {
      importedGames.push({ name: g.name, category: g.category, gameId: g.gameId, entryUrl: g.entryUrl });
      const found = await pingGame(g.gameId);
      if (!found) {
        const dbFiles = await loadFilesFromDB(g.gameId);
        if (!dbFiles.length) continue;
        const fileRecords = dbFiles.map(f => {
          const fileObj = new File([new Uint8Array(f.data)], f.path.split('/').pop(), { type: f.mimeType });
          return { file: fileObj, path: f.path, mimeType: f.mimeType };
        });
        await registerGameWithSW(g.gameId, fileRecords);
      }
    }
    renderGames();
  } catch(e) { console.error('ZenoPack restore failed:', e); }
})();
</script>
